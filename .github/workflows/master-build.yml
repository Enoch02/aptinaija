name: Master build

# Default branch only. PRs are covered by pull-request-checks.yml.
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: Lint, unit tests, release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run lint, unit tests, and release build
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      # The release build has no signing config yet, so this is an unsigned APK.
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-unsigned-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  instrumented-tests:
    name: Instrumented Compose UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # GitHub's Linux runners expose /dev/kvm to the emulator only after this.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --console=plain

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
